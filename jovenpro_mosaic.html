<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JovenPro — Mosaic Vitrina</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', sans-serif; }

        /* ============================================
           MOSAIC SECTION
           ============================================ */
        .mosaic-section {
            padding: 80px 0;
        }
        .mosaic-container {
            max-width: 1280px;
            margin: 0 auto;
            padding: 0 48px;
        }

        /* ── Header ── */
        .mosaic-header {
            display: flex;
            align-items: flex-end;
            justify-content: space-between;
            margin-bottom: 20px;
        }
        .mosaic-header-left {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        .mosaic-overline {
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 0.12em;
            text-transform: uppercase;
        }
        .mosaic-title {
            font-size: 28px;
            font-weight: 700;
        }
        .mosaic-link {
            font-size: 14px;
            font-weight: 500;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        /* ── Category Tabs (minimal + icon) ── */
        .tabs-nav {
            position: relative;
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 16px;
        }
        .cat-tabs {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            scrollbar-width: none;
            -ms-overflow-style: none;
            padding: 4px 2px;
            flex: 1;
            scroll-behavior: smooth;
        }
        .cat-tabs::-webkit-scrollbar { display: none; }

        .cat-tab {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 10px 16px;
            flex-shrink: 0;
            cursor: pointer;
            border: 1.5px solid;
            background: transparent;
            transition: all 0.2s ease;
        }
        .cat-tab .tab-icon {
            width: 18px;
            height: 18px;
            flex-shrink: 0;
        }
        .cat-tab .tab-name {
            font-size: 13px;
            font-weight: 600;
            white-space: nowrap;
        }
        .cat-tab .tab-count {
            font-size: 11px;
            font-weight: 500;
            margin-left: 2px;
        }

        .tabs-arrow {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            border: 1.5px solid;
            background: transparent;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            flex-shrink: 0;
            transition: all 0.2s ease;
        }
        .tabs-arrow svg {
            width: 16px;
            height: 16px;
        }

        /* ── Store Chips (liquid glass + avatar) ── */
        .store-selector {
            display: flex;
            gap: 10px;
            overflow-x: auto;
            scrollbar-width: none;
            -ms-overflow-style: none;
            padding: 4px 0 20px;
        }
        .store-selector::-webkit-scrollbar { display: none; }

        .store-chip {
            position: relative;
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 18px;
            min-width: 160px;
            height: 56px;
            flex-shrink: 0;
            cursor: pointer;
            overflow: hidden;
            border: none;
            background-size: cover;
            background-position: center;
            transition: all 0.25s ease;
        }
        .store-chip::after {
            content: '';
            position: absolute;
            inset: 0;
            background: rgba(255, 255, 255, 0.35);
            backdrop-filter: blur(12px) saturate(160%);
            -webkit-backdrop-filter: blur(12px) saturate(160%);
            transition: all 0.25s ease;
            z-index: 1;
        }
        .store-chip::before {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(
                135deg,
                rgba(255,255,255,0.5) 0%,
                rgba(255,255,255,0.1) 50%,
                rgba(255,255,255,0.0) 100%
            );
            z-index: 2;
            pointer-events: none;
        }
        .store-chip:hover::after {
            background: rgba(255, 255, 255, 0.55);
        }
        .store-chip.active::after {
            background: rgba(41, 128, 185, 0.25);
        }
        .store-chip.active {
            transform: translateY(-1px);
        }
        .chip-avatar {
            position: relative;
            z-index: 3;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            overflow: hidden;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 2px solid rgba(255,255,255,0.6);
        }
        .chip-avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .chip-name {
            position: relative;
            z-index: 3;
            font-size: 13px;
            font-weight: 700;
            white-space: nowrap;
            text-shadow: 0 1px 3px rgba(255,255,255,0.8);
        }

        /* ── Grid Desktop ── */
        .mosaic-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            grid-template-rows: 1fr 1fr;
            grid-template-areas:
                "mini1 featured"
                "mini2 featured";
            gap: 20px;
            height: 520px;
        }

        .mosaic-featured {
            grid-area: featured;
            display: flex;
            flex-direction: column;
            position: relative;
            overflow: hidden;
        }
        .mosaic-featured-image {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 32px;
            overflow: hidden;
        }
        .mosaic-featured-image img {
            max-width: 100%;
            max-height: 100%;
            object-fit: cover;
            transition: transform 0.5s ease;
        }
        .mosaic-featured:hover .mosaic-featured-image img {
            transform: scale(1.03);
        }
        .mosaic-featured-info {
            padding: 28px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .featured-badge {
            display: inline-flex;
            align-items: center;
            padding: 4px 10px;
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 0.05em;
            text-transform: uppercase;
            width: fit-content;
        }
        .featured-name {
            font-size: 22px;
            font-weight: 700;
            line-height: 1.3;
        }
        .featured-meta {
            font-size: 14px;
        }
        .featured-cta {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            margin-top: 6px;
            font-size: 13px;
            font-weight: 600;
            text-decoration: none;
        }
        .featured-cta:hover {
            gap: 12px;
        }

        .mosaic-mini {
            display: flex;
            align-items: stretch;
            overflow: hidden;
            transition: border-color 0.2s ease;
        }
        .mini-emprendedor { grid-area: mini1; }
        .mini-tienda { grid-area: mini2; }

        .mini-thumb {
            width: 140px;
            height: 100%;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }
        .mini-thumb img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .mini-info {
            flex: 1;
            padding: 20px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            gap: 5px;
        }
        .mini-label {
            font-size: 10px;
            font-weight: 600;
            letter-spacing: 0.1em;
            text-transform: uppercase;
        }
        .mini-name {
            font-size: 15px;
            font-weight: 600;
            line-height: 1.3;
        }
        .mini-meta {
            font-size: 13px;
        }
        .mini-desc {
            font-size: 13px;
            line-height: 1.5;
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        /* ============================================
           RESPONSIVE (< 768px)
           ============================================ */
        @media (max-width: 768px) {
            .mosaic-section {
                padding: 40px 0;
            }
            .mosaic-container {
                padding: 0 16px;
            }
            .mosaic-header {
                margin-bottom: 16px;
            }
            .mosaic-title {
                font-size: 20px;
            }

            .tabs-nav {
                gap: 6px;
                margin-bottom: 12px;
            }
            .cat-tabs {
                gap: 6px;
            }
            .cat-tab {
                padding: 8px 12px;
                min-width: 0;
            }
            .cat-tab .tab-name {
                font-size: 12px;
            }
            .cat-tab .tab-count {
                display: none;
            }
            .tabs-arrow {
                width: 32px;
                height: 32px;
            }

            .store-selector {
                padding-bottom: 16px;
                gap: 8px;
            }
            .store-chip {
                min-width: 0;
                width: calc((100vw - 80px) / 2.3);
                height: 52px;
                padding: 8px 12px;
            }
            .chip-avatar {
                width: 28px;
                height: 28px;
            }
            .chip-name {
                font-size: 12px;
            }

            .mosaic-grid {
                grid-template-columns: 1fr 1fr;
                grid-template-rows: auto auto auto;
                grid-template-areas:
                    "mini1 mini2"
                    "featured featured"
                    "featured featured";
                gap: 12px;
                height: auto;
            }
            .mosaic-featured {
                min-height: 380px;
            }
            .mosaic-featured-image {
                padding: 24px;
            }
            .mosaic-featured-info {
                padding: 20px;
            }
            .featured-name {
                font-size: 18px;
            }

            .mosaic-mini {
                flex-direction: column;
            }
            .mini-thumb {
                width: 100%;
                height: 120px;
            }
            .mini-info {
                padding: 14px;
                gap: 4px;
            }
            .mini-name {
                font-size: 13px;
            }
            .mini-desc {
                -webkit-line-clamp: 2;
                font-size: 12px;
            }
        }
    </style>
</head>

            { id: "16", name: "MUISCAFE", slug: "muiscafe", category: "alimentos", description: "Café de origen boyacense tostado artesanalmente en Sogamoso.", image: "https://images.unsplash.com/photo-1497935586351-b67a49e012bf?w=800&h=600&fit=crop", location: "Sogamoso", emprendedor: { name: "Gonzalo Chaparro", initials: "GC", avatar: "https://ui-avatars.com/api/?name=Gonzalo+Chaparro&background=2980b9&color=fff&size=128" } },
            { id: "36", name: "Abogados JCGM", slug: "julio-cesar-gonzalez", category: "servicios", description: "Asesoría legal integral para emprendedores y empresas en Sogamoso.", image: "https://images.unsplash.com/photo-1450101499163-c8848c66ca85?w=800&h=600&fit=crop", location: "Sogamoso, Boyacá", emprendedor: { name: "Julio González", initials: "JG", avatar: "https://ui-avatars.com/api/?name=Julio+Gonzalez&background=1a3d5c&color=fff&size=128" } },
            { id: "296", name: "Ángela Saavedra", slug: "angela-saavedra", category: "servicios", description: "Mentoría de negocios y capacitación para emprendedores.", image: "https://images.unsplash.com/photo-1551836022-d5d88e9218df?w=800&h=600&fit=crop", location: "", emprendedor: { name: "Ángela Saavedra", initials: "AS", avatar: "https://ui-avatars.com/api/?name=Angela+Saavedra&background=2980b9&color=fff&size=128" } },
        ];

        let activeCatIndex = 0;
        let activeStoreIndex = 0;

        function getStoresByCategory(catId) {
            if (catId === "todos") return stores;
            return stores.filter(s => s.category === catId);
        }

        // ── Render Category Tabs ──
        const catTabs = document.getElementById('catTabs');

        function renderTabs() {
            catTabs.innerHTML = '';
            categories.forEach((cat, i) => {
                const count = getStoresByCategory(cat.id).length;
                const btn = document.createElement('button');
                btn.className = 'cat-tab' + (i === activeCatIndex ? ' active' : '');
                btn.innerHTML = `
                    ${cat.icon}
                    <span class="tab-name">${cat.name}</span>
                    <span class="tab-count">(${count})</span>
                `;
                btn.onclick = () => {
                    activeCatIndex = i;
                    activeStoreIndex = 0;
                    renderTabs();
                    renderStoreSelector();
                    renderMosaic();
                };
                catTabs.appendChild(btn);
            });
            setTimeout(() => {
                const active = catTabs.querySelector('.active');
                if (active) active.scrollIntoView({ behavior: 'smooth', inline: 'center', block: 'nearest' });
            }, 10);
        }

        catTabs.addEventListener('wheel', (e) => {
            if (Math.abs(e.deltaY) > Math.abs(e.deltaX)) {
                e.preventDefault();
                catTabs.scrollLeft += e.deltaY;
            }
        }, { passive: false });

        function scrollTabs(dir) {
            const isMobile = window.innerWidth <= 768;
            const scrollAmount = isMobile ? 150 : 200;
            catTabs.scrollBy({ left: dir * scrollAmount, behavior: 'smooth' });
        }

        // ── Render Store Chips ──
        const storeSelector = document.getElementById('storeSelector');

        function renderStoreSelector() {
            const cat = categories[activeCatIndex];
            const catStores = getStoresByCategory(cat.id);
            storeSelector.innerHTML = '';

            catStores.forEach((store, i) => {
                const chip = document.createElement('button');
                chip.className = 'store-chip' + (i === activeStoreIndex ? ' active' : '');
                chip.style.backgroundImage = `url(${store.image})`;
                chip.innerHTML = `
                    <div class="chip-avatar"><img src="${store.emprendedor.avatar}" alt="${store.emprendedor.name}"></div>
                    <span class="chip-name">${store.name}</span>
                `;
                chip.onclick = () => {
                    activeStoreIndex = i;
                    renderStoreSelector();
                    renderMosaic();
                };
                storeSelector.appendChild(chip);
            });
        }

        // ── Render Mosaic Grid ──
        function renderMosaic() {
            const cat = categories[activeCatIndex];
            const catStores = getStoresByCategory(cat.id);
            const store = catStores[activeStoreIndex] || catStores[0];
            if (!store) return;

            document.getElementById('mosaicTitle').textContent = cat.name === "Todos" ? store.name : `${cat.name}: ${store.name}`;

            document.getElementById('miniEmpImg').src = store.emprendedor.avatar;
            document.getElementById('miniEmpImg').alt = store.emprendedor.name;
            document.getElementById('miniEmpName').textContent = store.emprendedor.name;
            document.getElementById('miniEmpLoc').textContent = store.location;

            document.getElementById('miniTiendaImg').src = store.image;
            document.getElementById('miniTiendaImg').alt = store.name;
            document.getElementById('miniTiendaName').textContent = store.name;
            document.getElementById('miniTiendaDesc').textContent = store.description;

            document.getElementById('featImg').src = store.image;
            document.getElementById('featImg').alt = store.name;
            document.getElementById('featName').textContent = store.name;
            document.getElementById('featSeller').textContent = `Por ${store.emprendedor.name} · ${store.location}`;
            document.getElementById('featCta').href = `https://jovenpro.com/tienda/${store.slug}/`;
        }

        // Init
        renderTabs();
        renderStoreSelector();
        renderMosaic();
    </script>

</body>
</html>
